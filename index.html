    <!-- Structured data: FAQPage (boosts visibility in Google rich results) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Czy nadpłata kredytu hipotecznego zawsze się opłaca?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "W ogromnej większości przypadków tak – szczególnie przy kredytach ze zmiennym oprocentowaniem. Porównaj oprocentowanie kredytu z potencjalnym zyskiem z inwestycji. Jeśli kredyt kosztuje Cię 6–8%, a bezpieczna lokata daje 4–5%, nadpłata jest racjonalnym wyborem."
          }
        },
        {
          "@type": "Question",
          "name": "Kiedy najlepiej zacząć nadpłacać kredyt hipoteczny?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Im wcześniej, tym lepiej – na początku kredytu odsetki stanowią największą część raty. Każda złotówka nadpłaty w pierwszych latach zarabia wielokrotnie więcej niż ta sama złotówka nadpłacona pod koniec."
          }
        },
        {
          "@type": "Question",
          "name": "Lepiej skrócić okres kredytu czy obniżyć ratę po nadpłacie?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Finansowo korzystniejsze jest skrócenie okresu – mniej rat oznacza mniej odsetek. Jednak obniżenie raty może mieć sens, jeśli zależy Ci na poprawie płynności finansowej. Możesz też stosować strategię hybrydową: obniżać ratę, ale nadal wpłacać poprzednią kwotę."
          }
        },
        {
          "@type": "Question",
          "name": "Co to jest prowizja za nadpłatę kredytu i jak na nią uważać?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Prawo bankowe pozwala bankom pobierać prowizję za wcześniejszą spłatę przez pierwsze 36 miesięcy. Po 3 latach prowizja jest zazwyczaj niedozwolona. Sprawdź umowę – wiele banków nie pobiera jej wcale. Kalkulator uwzględnia ten koszt w obliczeniach."
          }
        },
        {
          "@type": "Question",
          "name": "Czy warto najpierw zbudować poduszkę finansową, a dopiero potem nadpłacać?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Zasada ogólna: najpierw zbuduj poduszkę finansową na 3–6 miesięcy wydatków, dopiero potem nadpłacaj. Brak poduszki to ryzyko sięgania po drogi kredyt konsumpcyjny w razie nagłych wydatków."
          }
        },
        {
          "@type": "Question",
          "name": "Czy nadpłatę kredytu można cofnąć lub wycofać?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Nie – nadpłata to trwałe zmniejszenie salda kredytu i nie można jej cofnąć. Dlatego trzymaj poduszkę finansową osobno i nadpłacaj tylko wolne środki, których nie będziesz potrzebować."
          }
        },
        {
          "@type": "Question",
          "name": "Jak poinformować bank o nadpłacie kredytu hipotecznego?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Najczęściej wystarczy przelew na numer rachunku kredytowego z odpowiednim tytułem, np. 'nadpłata kredytu nr XXXX – spłata kapitału'. Sprawdź regulamin banku lub zadzwoń na infolinię."
          }
        }
      ]
    }
