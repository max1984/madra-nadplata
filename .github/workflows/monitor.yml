name: Monitor nadplata.org

# Cotygodniowa kontrola żywotności strony. Nie wymaga żadnych sekretów ani
# konfiguracji — GitHub domyślnie wysyła e-mail do właściciela repozytorium,
# gdy zaplanowany (`schedule`) workflow kończy się niepowodzeniem. To jedyny
# "alarm" w tym projekcie i celowo nie wymaga niczego poza domyślnymi
# ustawieniami powiadomień GitHuba.
on:
  schedule:
    - cron: '17 6 * * 1' # każdy poniedziałek, 06:17 UTC
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Strona główna odpowiada
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://nadplata.org/)
          echo "HTTP $code"
          test "$code" = "200"

      - name: Sitemap istnieje i ma wpisy
        run: |
          curl -s https://nadplata.org/sitemap.xml -o /tmp/sitemap.xml
          count=$(grep -c '<url>' /tmp/sitemap.xml || true)
          echo "Adresów w sitemap: $count"
          test "$count" -ge 10

      - name: Reprezentatywne podstrony SEO odpowiadają
        run: |
          for path in \
            "kalkulator-nadplaty-300000-zl" \
            "czy-oplaca-sie-nadplacac-kredyt-hipoteczny"
          do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://nadplata.org/$path/")
            echo "$path -> HTTP $code"
            test "$code" = "200"
          done

      - name: robots.txt wskazuje na sitemap
        run: |
          curl -s https://nadplata.org/robots.txt | grep -qi 'sitemap' \
            || (echo "Brak odniesienia do sitemap w robots.txt" && exit 1)
