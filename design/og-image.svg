<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="55%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1160" cy="40" r="260" fill="#ffffff" opacity="0.08" filter="url(#soft)"/>
  <circle cx="20" cy="610" r="220" fill="#ffffff" opacity="0.07" filter="url(#soft)"/>

  <!-- Left: badge, headline, subhead, chips, domain -->
  <rect x="80" y="70" width="300" height="34" rx="17" fill="#ffffff" opacity="0.16"/>
  <text x="100" y="92" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#ffffff">KALKULATOR NADPŁATY KREDYTU</text>

  <text x="78" y="212" font-family="Arial, sans-serif" font-size="66" font-weight="800" fill="#ffffff">Mądra Nadpłata</text>

  <text x="80" y="268" font-family="Arial, sans-serif" font-size="28" font-weight="500" fill="#ffffff" opacity="0.92">Oblicz, ile zaoszczędzisz</text>
  <text x="80" y="304" font-family="Arial, sans-serif" font-size="28" font-weight="500" fill="#ffffff" opacity="0.92">nadpłacając kredyt hipoteczny</text>

  <g font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">
    <rect x="80" y="340" width="130" height="42" rx="21" fill="#ffffff" opacity="0.15" stroke="#ffffff" stroke-opacity="0.35"/>
    <text x="103" y="367">Za darmo</text>
    <rect x="226" y="340" width="195" height="42" rx="21" fill="#ffffff" opacity="0.15" stroke="#ffffff" stroke-opacity="0.35"/>
    <text x="249" y="367">Bez rejestracji</text>
    <rect x="437" y="340" width="205" height="42" rx="21" fill="#ffffff" opacity="0.15" stroke="#ffffff" stroke-opacity="0.35"/>
    <text x="460" y="367">Wynik w 5 sekund</text>
  </g>

  <rect x="80" y="515" width="40" height="40" rx="12" fill="#ffffff" opacity="0.18"/>
  <text x="100" y="541" font-family="Arial, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">zł</text>
  <text x="134" y="543" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">nadplata.org</text>

  <!-- Right: example card -->
  <rect x="740" y="110" width="380" height="430" rx="28" fill="#ffffff" filter="url(#cardShadow)"/>

  <text x="776" y="158" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#64748b">PRZYKŁAD: 300 000 ZŁ · 6% · 30 LAT</text>

  <text x="776" y="196" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Bez nadpłaty</text>
  <rect x="776" y="208" width="308" height="22" rx="11" fill="#f1f5f9"/>
  <rect x="776" y="208" width="308" height="22" rx="11" fill="#dc2626"/>

  <text x="776" y="250" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Z nadpłatą 500 zł/mc</text>
  <rect x="776" y="262" width="308" height="22" rx="11" fill="#f1f5f9"/>
  <rect x="776" y="262" width="169" height="22" rx="11" fill="#047857"/>

  <line x1="776" y1="300" x2="1084" y2="300" stroke="#e3e8f0" stroke-width="1"/>

  <text x="776" y="352" font-family="Arial, sans-serif" font-size="38" font-weight="800" fill="#047857">−80 000 zł</text>
  <text x="776" y="378" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#475569">mniej odsetek</text>

  <text x="776" y="436" font-family="Arial, sans-serif" font-size="38" font-weight="800" fill="#2563eb">−kilka lat</text>
  <text x="776" y="462" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#475569">krótszy kredyt</text>

  <text x="776" y="520" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">* przykładowe wyliczenie z kalkulatora nadplata.org</text>
</svg>
